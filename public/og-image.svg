<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="YN Blog - 现代化的博客平台">
  <title>YN Blog - 分享技术、设计与灵感</title>
  <desc>YN Blog OG 图片，现代化的博客平台</desc>
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <circle cx="100" cy="100" r="150" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="200" fill="rgba(255,255,255,0.1)"/>
  <circle cx="600" cy="315" r="100" fill="rgba(255,255,255,0.05)"/>
  
  <rect x="100" y="200" width="1000" height="230" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  
  <text x="600" y="290" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#1f2937" text-anchor="middle">YN Blog</text>
  
  <text x="600" y="370" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" fill="#6b7280" text-anchor="middle">现代化的博客平台</text>
  
  <text x="600" y="580" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">分享技术、设计与灵感</text>
</svg>
